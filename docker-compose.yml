services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
